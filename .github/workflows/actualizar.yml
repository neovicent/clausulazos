name: Actualizar clausulazos

on:
  schedule:
    - cron: "17 */3 * * *"   # cada 3 horas (hora UTC)
  workflow_dispatch:          # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-clausulazos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Leer el feed y registrar clausulazos
        env:
          MISTER_COOKIE: ${{ secrets.MISTER_COOKIE }}
        run: python scraper/mister_clausulazos.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/clausulazos.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualiza clausulazos"
            git pull --rebase   # por si se ha añadido algo a mano mientras tanto
            git push
          fi
